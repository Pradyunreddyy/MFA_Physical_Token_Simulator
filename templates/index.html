<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MFA Physical Token Simulator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f4f8;
        }

        .container {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .token-display {
            background: #111827;
            color: #00ff88;
            padding: 22px;
            border-radius: 12px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        #message {
            font-weight: bold;
            min-height: 24px;
        }

        .architecture {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔐 MFA Token</h1>

    <div class="subtitle">
        Physical Token Simulator
    </div>

    <div class="token-display" id="otpDisplay">
        ------
    </div>

    <button onclick="generateOTP()">
        Generate OTP
    </button>

    <input
        type="text"
        id="otpInput"
        maxlength="6"
        placeholder="Enter OTP"
    >

    <button onclick="verifyOTP()">
        Verify OTP
    </button>

    <div id="message"></div>

</div>

<script>

let currentOTP = null;
let otpExpiry = null;

async function generateOTP() {

    const response = await fetch("/generate", {
        method: "POST"
    });

    const data = await response.json();

    if (data.success) {

        // Store the generated OTP
        currentOTP = data.otp;

        // OTP is valid for 60 seconds
        otpExpiry = Math.floor(Date.now() / 1000) + 60;

        document.getElementById("otpDisplay").textContent = data.otp;

        document.getElementById("message").textContent =
            "OTP generated. Valid for 60 seconds.";
    }
}


async function verifyOTP() {

    const enteredOTP =
        document.getElementById("otpInput").value;

    if (!currentOTP) {
        document.getElementById("message").textContent =
            "Please generate an OTP first.";
        return;
    }

    if (!enteredOTP) {
        document.getElementById("message").textContent =
            "Please enter the OTP.";
        return;
    }

    try {

        const response = await fetch(
            "https://em6o4xfku2ft2b5cwu3p47ougq0ddgqn.lambda-url.us-east-1.on.aws/",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    generated_otp: currentOTP,
                    entered_otp: enteredOTP,
                    expiry: otpExpiry
                })
            }
        );

        const data = await response.json();

        document.getElementById("message").textContent =
            data.message;

    } catch (error) {

        console.error(error);

        document.getElementById("message").textContent =
            "Error connecting to AWS Lambda.";
    }
}

</script>

</body>
</html>
